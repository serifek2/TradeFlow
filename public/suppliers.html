<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Tedarikçiler</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles/light.css" />
  <script src="/js/api-base.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root { --bg:#ede9e2; --card:#ffffff; --card-elevated:#ffffff; --card-soft:#f5f3ef; --border:rgba(110,100,85,0.2); --border-subtle:rgba(110,100,85,0.13); --accent:#4f46e5; --text:#1c1a2e; --text-heading:#0e0c1a; --text-secondary:#3d3a54; --muted:#6b677e; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', sans-serif; min-height: 100vh; padding: 20px 16px 32px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 24px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .card { padding: 18px 20px; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: 12px; }
    .btn { padding: 8px 16px; border-radius: 8px; border: none; background: #4f46e5; color: white; cursor: pointer; font-size: 13px; }
    .btn:hover { opacity: 0.9; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 4px; }
    .input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: #f8fafc; color: var(--text); margin-bottom: 12px; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 1000; }
    .modal.show { display: flex; }
    .modal-inner { background: #ffffff; padding: 24px; border-radius: 18px; max-width: 400px; width: 90%; border: 1px solid rgba(200,195,215,0.4); box-shadow: 0 4px 8px rgba(20,16,40,0.06), 0 20px 50px rgba(20,16,40,0.18); }
    .modal h3 { margin: 0 0 16px; }
    .row { display: flex; gap: 8px; margin-top: 16px; }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover { background: rgba(51,65,85,0.25); }
    .detail-modal .modal-inner { max-width: 420px; }
    .detail-modal .detail-row { margin-bottom: 12px; font-size: 14px; }
    .detail-modal .detail-label { color: var(--muted); font-size: 12px; margin-bottom: 2px; }
    .detail-modal .detail-value { color: var(--text); }
  </style>
</head>
<body>
  <div class="container">
    <a href="/">&larr; Ana Sayfa</a>
    <h1>Tedarikçiler</h1>
    <div class="card">
      <div class="toolbar">
        <button class="btn" onclick="openModal()">+ Yeni Tedarikçi</button>
        <button type="button" class="btn btn-ghost" onclick="exportSuppliersExcel()">Excel indir (.xlsx)</button>
      </div>
      <p id="excel-status" style="font-size:12px;color:var(--muted);margin:8px 0 0;"></p>
      <table style="margin-top:12px;">
        <thead><tr><th>Ad</th><th>İletişim</th><th>Telefon</th><th></th></tr></thead>
        <tbody id="list"></tbody>
      </table>
    </div>
  </div>

  <div id="detail-modal" class="modal detail-modal">
    <div class="modal-inner">
      <h3 id="detail-title">Tedarikçi Detayı</h3>
      <div id="detail-body"></div>
      <div class="row" style="margin-top:16px;">
        <button class="btn btn-ghost" onclick="closeDetail()">Kapat</button>
        <button class="btn" id="detail-edit-btn">Düzenle</button>
      </div>
    </div>
  </div>

  <div id="modal" class="modal">
    <div class="modal-inner">
      <h3 id="modal-title">Yeni Tedarikçi</h3>
      <input id="m-name" class="input" placeholder="Tedarikçi adı *" />
      <input id="m-contact" class="input" placeholder="Yetkili kişi" />
      <input id="m-phone" class="input" placeholder="Telefon" />
      <input id="m-email" class="input" placeholder="E-posta" />
      <input id="m-address" class="input" placeholder="Adres" />
      <input id="m-tax" class="input" placeholder="Vergi no" />
      <div class="row">
        <button class="btn btn-ghost" onclick="closeModal()">İptal</button>
        <button class="btn" onclick="saveSupplier()">Kaydet</button>
      </div>
    </div>
  </div>

  <script>
    (function(){ if (!sessionStorage.getItem('token')) window.location.href = '/'; })();
    function authHeaders() { const t = sessionStorage.getItem('token'); return t ? { 'Authorization': 'Bearer ' + t } : {}; }
    let editingId = null;
    let suppliersList = [];
    async function load() {
      const res = await fetch('/api/suppliers', { headers: authHeaders() });
      const { suppliers } = await res.json();
      suppliersList = suppliers || [];
      const tbody = document.getElementById('list');
      tbody.innerHTML = suppliersList.map(s => `
        <tr class="clickable" onclick="showDetail(${s.id})" title="Detay için tıklayın">
          <td>${escapeHtml(s.name)}</td>
          <td>${escapeHtml(s.contact_person || '-')}</td>
          <td>${escapeHtml(s.phone || '-')}</td>
          <td onclick="event.stopPropagation()">
            <button class="btn btn-ghost" onclick="edit(${s.id})">Düzenle</button>
            <button class="btn btn-ghost" onclick="del(${s.id})">Sil</button>
          </td>
        </tr>
      `).join('');
    }
    function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function sheetFromRows(rows, headers, keys) {
      const aoa = [headers];
      rows.forEach((r) => { aoa.push(keys.map((k) => (r[k] != null ? r[k] : ''))); });
      return XLSX.utils.aoa_to_sheet(aoa);
    }
    function setExcelStatus(t) { const el = document.getElementById('excel-status'); if (el) el.textContent = t || ''; }
    async function exportSuppliersExcel() {
      if (typeof XLSX === 'undefined') { setExcelStatus('Excel kütüphanesi yüklenemedi.'); return; }
      setExcelStatus('İndiriliyor...');
      try {
        const res = await fetch('/api/suppliers', { headers: authHeaders() });
        const data = await res.json();
        const rows = data.suppliers || [];
        const wb = XLSX.utils.book_new();
        const ws = sheetFromRows(rows, ['id', 'Ad', 'Yetkili', 'Telefon', 'E-posta', 'Adres', 'Vergi No'],
          ['id', 'name', 'contact_person', 'phone', 'email', 'address', 'tax_number']);
        XLSX.utils.book_append_sheet(wb, ws, 'Tedarikciler');
        XLSX.writeFile(wb, 'tedarikciler-' + new Date().toISOString().split('T')[0] + '.xlsx');
        setExcelStatus('İndirildi: ' + rows.length + ' kayıt.');
      } catch (e) {
        setExcelStatus('Hata: ' + (e.message || ''));
      }
    }
    function showDetail(id) {
      const s = suppliersList.find(x => x.id === id);
      if (!s) return;
      document.getElementById('detail-title').textContent = s.name;
      document.getElementById('detail-body').innerHTML = `
        <div class="detail-row"><div class="detail-label">Yetkili kişi</div><div class="detail-value">${escapeHtml(s.contact_person || '-')}</div></div>
        <div class="detail-row"><div class="detail-label">Telefon</div><div class="detail-value">${escapeHtml(s.phone || '-')}</div></div>
        <div class="detail-row"><div class="detail-label">E-posta</div><div class="detail-value">${escapeHtml(s.email || '-')}</div></div>
        <div class="detail-row"><div class="detail-label">Adres</div><div class="detail-value">${escapeHtml(s.address || '-')}</div></div>
        <div class="detail-row"><div class="detail-label">Vergi no</div><div class="detail-value">${escapeHtml(s.tax_number || '-')}</div></div>
      `;
      document.getElementById('detail-edit-btn').onclick = () => { closeDetail(); edit(id); };
      document.getElementById('detail-modal').classList.add('show');
    }
    function closeDetail() { document.getElementById('detail-modal').classList.remove('show'); }
    function openModal(id) {
      editingId = id || null;
      document.getElementById('modal-title').textContent = id ? 'Tedarikçi Düzenle' : 'Yeni Tedarikçi';
      if (id) {
        fetch('/api/suppliers', { headers: authHeaders() }).then(r=>r.json()).then(({suppliers})=>{
          const s = suppliers.find(x=>x.id==id);
          if (s) {
            document.getElementById('m-name').value = s.name;
            document.getElementById('m-contact').value = s.contact_person || '';
            document.getElementById('m-phone').value = s.phone || '';
            document.getElementById('m-email').value = s.email || '';
            document.getElementById('m-address').value = s.address || '';
            document.getElementById('m-tax').value = s.tax_number || '';
          }
        });
      } else {
        document.getElementById('m-name').value = '';
        document.getElementById('m-contact').value = '';
        document.getElementById('m-phone').value = '';
        document.getElementById('m-email').value = '';
        document.getElementById('m-address').value = '';
        document.getElementById('m-tax').value = '';
      }
      document.getElementById('modal').classList.add('show');
    }
    function closeModal() { document.getElementById('modal').classList.remove('show'); }
    function edit(id) { openModal(id); event && event.stopPropagation(); }
    async function saveSupplier() {
      const payload = {
        name: document.getElementById('m-name').value.trim(),
        contact_person: document.getElementById('m-contact').value.trim() || null,
        phone: document.getElementById('m-phone').value.trim() || null,
        email: document.getElementById('m-email').value.trim() || null,
        address: document.getElementById('m-address').value.trim() || null,
        tax_number: document.getElementById('m-tax').value.trim() || null
      };
      if (!payload.name) { alert('Tedarikçi adı zorunludur'); return; }
      const url = editingId ? `/api/suppliers/${editingId}` : '/api/suppliers';
      const method = editingId ? 'PUT' : 'POST';
      const res = await fetch(url, { method, headers: { ...authHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      if (res.ok) { closeModal(); load(); } else { const e = await res.json(); alert(e.error || 'Hata'); }
    }
    async function del(id) {
      if (!confirm('Silmek istediğinize emin misiniz?')) return;
      const res = await fetch(`/api/suppliers/${id}`, { method: 'DELETE', headers: authHeaders() });
      if (res.ok) load(); else alert((await res.json()).error || 'Hata');
    }
    load();
  </script>
</body>
</html>
